name: Build SAYURARUN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/android@8.5.0

      - name: Init Capacitor
        run: |
          npx cap init SAYURARUN com.sayurarun.game --web-dir dist
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Update app name
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">SAYURARUN<\/string>/' \
            android/app/src/main/res/values/strings.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAYURARUN-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
